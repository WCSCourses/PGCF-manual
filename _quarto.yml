project:
  type: website
  output-dir: docs
  
  
website:
  title: "Pathogen Genomics Competency Framework"
  description: "User manual for the Pathogen Genomics Competency Framework (PGCF)."
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Get Started"
        href: getting-started/index.qmd
      - text: "Explanation"
        href: explanation/index.qmd
      - text: "Reference"
        href: reference/index.qmd
      - text: "FAQ"
        href: faq.qmd
      - text: "About"
        href: about/index.qmd
    right:
      - icon: github
        href: https://github.com/WCSCourses/pgcf-manual
        aria-label: GitHub

  sidebar:
    style: "docked"
    search: true
    collapse-level: 1
    contents:

      - section: "Getting Started"
        href: getting-started/index.qmd
        contents:
          - getting-started/what-is-a-competency-framework.qmd
          - getting-started/what-makes-pgcf-different.qmd
          - getting-started/when-to-use-pgcf.qmd
          - getting-started/components-overview.qmd

      - section: "Tutorials"
        href: tutorials/index.qmd
        contents:
          - tutorials/individual-learner.qmd
          - tutorials/curriculum-design.qmd
          - tutorials/workforce-planning.qmd
          - tutorials/course-mapping.qmd

      - section: "How-to Guides"
        href: how-to/index.qmd
        contents:
          - how-to/gap-analysis.qmd
          - how-to/map-a-curriculum.qmd
          - how-to/define-role-profiles.qmd
          - how-to/training-needs-assessment.qmd
          - how-to/integrate-into-short-courses.qmd
          - how-to/interpret-blooms-levels.qmd
          - how-to/use-across-sectors.qmd

      - section: "Framework Explanation"
        href: explanation/index.qmd
        contents:
          - explanation/framework-overview.qmd
          - explanation/domains-and-structure.qmd
          - explanation/competencies-and-ksa.qmd
          - explanation/blooms-taxonomy-in-pgcf.qmd
          - explanation/development-methodology.qmd

      - section: "Reference"
        href: reference/index.qmd
        contents:
          - reference/domains-and-topics.qmd
          - reference/competency-statements.qmd
          - reference/role-profiles.qmd
          - reference/data-model.qmd

      - section: "Tools & Implementation"
        href: tools/index.qmd
        contents:
          - tools/self-assessment-tool.qmd
          - tools/competency-database.qmd
          - tools/templates.qmd
          - tools/ai-assistant.qmd

      - section: "Use Cases / Case Studies"
        href: use-cases/index.qmd
        contents:
          - use-cases/academic-course-design.qmd
          - use-cases/public-health-workforce-planning.qmd
          - use-cases/clinical-genomics-integration.qmd
          - use-cases/short-course-training.qmd
          - use-cases/national-level-implementation.qmd

      - section: "FAQs & Troubleshooting"
        contents:
          - faq.qmd

      - section: "About & Governance"
        href: about/index.qmd
        contents:
          - about/versioning.qmd
          - about/updates-and-governance.qmd
          - about/contributors.qmd
          - about/license.qmd
  
  page-navigation: true 
  page-footer: 
    left: "This work is licensed under a Creative Commons Attribution 4.0 International License. Reuse is encouraged with acknowledgement" 
  search:
    location: navbar
    type: textbox

output:
  html_document:
    highlight: pygments
    css: "_extensions/styles.css"
    toc: true
    toc_float:
      collapsed: false

format:
  html:
    number-sections: true
    number-depth: 5
    theme:
      light: [cosmo, theme.scss]
    anchor-sections: true
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true

editor: visual

execute:
  freeze: auto
  
sidebar:
  contents: auto

link-external-newwindow: true
